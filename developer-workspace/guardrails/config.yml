# NeMo Guardrails config for the Mesh weather agent.
# Rail checks go through the LiteLLM gateway with their own virtual key
# (model alias 'guardrails' in litellm/config.yaml) - no extra model or GPU.

models:
  - type: main
    engine: openai
    model: guardrails
    api_key_env_var: LITELLM_RAILS_KEY   # set from Vault by vault_client.load_litellm_keys()
    parameters:
      base_url: http://litellm:4000/v1
      temperature: 0
      max_tokens: 8

rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
