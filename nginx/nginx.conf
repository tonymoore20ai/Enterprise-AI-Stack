# Enterprise AI stack gateway: the single TLS entry point.
#   https://langfuse.ai.internal  -> Langfuse UI
#   https://grafana.ai.internal   -> Grafana
#   https://api.ai.internal       -> weather agent chat API (API key required, X-API-Key)
#   https://llm.ai.internal       -> LiteLLM gateway (virtual key required, Authorization: Bearer)
#   https://code.ai.internal      -> VS Code in the browser (code-server password)
# Published on 127.0.0.1 only (this machine). Certificates: ./nginx/make_certs.sh

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  # Resolve upstream containers at request time (Docker DNS), so nginx starts even
  # if one service is down, and picks up containers that were recreated.
  resolver 127.0.0.11 valid=30s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Rate limits per client IP (on top of LiteLLM's per-key limits)
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=llm:10m rate=120r/m;
  limit_req_status 429;

  # TLS: one certificate covers all four names (signed by the local CA)
  ssl_certificate     /etc/nginx/certs/ai.internal.crt;
  ssl_certificate_key /etc/nginx/certs/ai.internal.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Proxy defaults
  client_max_body_size 10m;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;
  proxy_connect_timeout 10s;
  proxy_read_timeout    300s;

  # Plain HTTP -> HTTPS
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # Unknown host names on 443: close the connection
  server {
    listen 443 ssl default_server;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name langfuse.ai.internal;
    location / {
      set $upstream http://langfuse-server:3000;
      proxy_pass $upstream;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name grafana.ai.internal;
    location / {
      set $upstream http://grafana:3000;
      proxy_pass $upstream;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.ai.internal;
    location / {
      limit_req zone=api burst=10 nodelay;
      proxy_read_timeout 180s;          # a full agent turn can take ~10 s; generous margin
      set $upstream http://agent-api:8080;
      proxy_pass $upstream;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name code.ai.internal;
    location / {
      proxy_read_timeout 1d;            # the IDE keeps a WebSocket open for the whole session
      proxy_send_timeout 1d;
      client_max_body_size 200m;        # drag-and-drop uploads into the workspace
      set $upstream http://vscode-ide:8443;
      proxy_pass $upstream;
    }
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name llm.ai.internal;
    location / {
      limit_req zone=llm burst=20 nodelay;
      proxy_buffering off;              # stream tokens as they are generated
      proxy_read_timeout 300s;
      set $upstream http://litellm:4000;
      proxy_pass $upstream;
    }
  }
}
